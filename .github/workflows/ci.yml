name: CI

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, lint, build, and package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Run lint
        run: npm run lint

      - name: Build website
        run: npm run build

      - name: Build and package extension
        shell: pwsh
        run: ./scripts/package-extension.ps1

      - name: Upload unpacked extension
        uses: actions/upload-artifact@v7
        with:
          name: siptime-unpacked-${{ github.sha }}
          path: dist-extension
          if-no-files-found: error
          retention-days: 14

      - name: Upload Chrome Web Store ZIP
        uses: actions/upload-artifact@v7
        with:
          path: releases/SipTime-v*-chrome.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
